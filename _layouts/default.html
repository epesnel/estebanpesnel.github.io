---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js" data-theme="dark">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    <!-- Gradient mesh background -->
    <div class="gradient-mesh" aria-hidden="true">
      <div class="gm-orb gm-orb-1"></div>
      <div class="gm-orb gm-orb-2"></div>
      <div class="gm-orb gm-orb-3"></div>
      <div class="gm-noise"></div>
    </div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    <!-- Reading progress bar -->
    <div class="reading-progress" id="readingProgress"></div>

    <!-- Scroll to top button -->
    <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>

    {% include scripts.html %}

    <script>
    (function() {
      var progress = document.getElementById('readingProgress');
      var scrollBtn = document.getElementById('scrollToTop');

      window.addEventListener('scroll', function() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (docHeight > 0) {
          progress.style.width = (scrollTop / docHeight * 100) + '%';
        }
        if (scrollTop > 300) {
          scrollBtn.classList.add('visible');
        } else {
          scrollBtn.classList.remove('visible');
        }
      });

      scrollBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
    </script>

  </body>
</html>
