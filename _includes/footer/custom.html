<!-- Scroll reveal animations -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  var selectors = [
    '.intro-card',
    '.research-card',
    '.eq-block',
    '.pub-list-card',
    '.poster-card',
    '.tl-card',
    '.cv-entry',
    '.teach-card',
    '.hs',
    '.strip-wrapper h2'
  ];
  var gridSelectors = ['.topic-item'];

  selectors.forEach(function(sel) {
    document.querySelectorAll(sel).forEach(function(el) {
      if (!el.classList.contains('reveal') && !el.classList.contains('reveal-scale')) {
        el.classList.add('reveal');
      }
    });
  });

  gridSelectors.forEach(function(sel) {
    document.querySelectorAll(sel).forEach(function(el, i) {
      if (!el.classList.contains('reveal-scale')) {
        el.classList.add('reveal-scale');
        el.classList.add('reveal-delay-' + Math.min(i + 1, 6));
      }
    });
  });

  document.querySelectorAll('.timeline-item').forEach(function(el) {
    if (!el.classList.contains('reveal-left')) el.classList.add('reveal-left');
  });

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.reveal, .reveal-left, .reveal-scale').forEach(function(el) {
    observer.observe(el);
  });
});
</script>

<!-- Cursor glow effect on cards -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  var glowSelectors = [
    '.topic-item'
  ];

  glowSelectors.forEach(function(sel) {
    document.querySelectorAll(sel).forEach(function(el) {
      el.classList.add('glow-card');
      el.addEventListener('mousemove', function(e) {
        var rect = el.getBoundingClientRect();
        el.style.setProperty('--glow-x', (e.clientX - rect.left) + 'px');
        el.style.setProperty('--glow-y', (e.clientY - rect.top) + 'px');
      });
    });
  });
});
</script>

<!-- Page transition (fade-out / fade-in) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:') || link.target === '_blank' || link.hasAttribute('download')) return;
    if (link.origin !== window.location.origin) return;
    e.preventDefault();
    document.body.classList.add('page-exit');
    setTimeout(function() { window.location.href = link.href; }, 250);
  });
  window.addEventListener('pageshow', function(e) {
    document.body.classList.remove('page-exit');
  });
});
</script>
